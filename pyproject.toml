[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-interface-protocol"
version = "0.6.0"
description = "Immutable Agent Interface Protocol DTOs for host and agent handoff."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Agent Interface Protocol contributors" }]
keywords = ["agents", "protocol", "handoff", "interoperability", "dto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Required to exercise tests that validate AIP payloads against the
# JSON Schemas in agent_interface_protocol.schema. Without these,
# pytest.importorskip silently skips schema validation coverage.
# 4.18+ supports JSON Schema Draft 2020-12. `build` is used by the
# packaging tests that build a real wheel/sdist and assert the
# committed schema JSON files are present.
test = ["jsonschema>=4.18", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/jmaddaus/agent-interface-protocol"
Source = "https://github.com/jmaddaus/agent-interface-protocol"
Issues = "https://github.com/jmaddaus/agent-interface-protocol/issues"

[tool.setuptools]
# Make sure non-.py files declared in package-data also reach the
# sdist. Without this, some setuptools versions drop them from the
# source distribution while keeping them in the wheel.
include-package-data = true

[tool.setuptools.packages.find]
include = ["agent_interface_protocol*"]

[tool.setuptools.package-data]
agent_interface_protocol = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
