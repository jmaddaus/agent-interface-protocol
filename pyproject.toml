[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-interface-protocol"
version = "0.1.0"
description = "Immutable Agent Interface Protocol DTOs for host and agent handoff."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Agent Interface Protocol maintainers" }]

[tool.setuptools.packages.find]
include = ["agent_interface_protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
